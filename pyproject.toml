[build-system]
requires = ["setuptools>=75,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-market-data-recorder"
version = "0.1.0a1"
description = "Independent, unofficial recorder for Binance public market data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "binance-sdk-derivatives-trading-usds-futures==14.0.0",
  "binance-sdk-spot==10.0.0",
  "cbor2==6.1.3",
  "google-crc32c==1.8.0",
  "pydantic>=2.10,<3",
  "pyarrow==25.0.0",
  "pyobjc-framework-Cocoa==12.2.1; sys_platform == 'darwin'",
  "pyobjc-framework-DiskArbitration==12.2.1; sys_platform == 'darwin'",
  "websockets==15.0.1",
  "zstandard==0.25.0",
]

[project.optional-dependencies]
dev = [
  "duckdb==1.5.5",
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
binance-market-recorder = "binance_market_data_recorder.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
binance_market_data_recorder = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra -m 'not stress'"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "online: opt-in tests that contact unsigned public Binance endpoints",
  "stress: resource-intensive acceptance tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "tools"]
exclude = ["tests/verify_m0_contracts.py"]
warn_unused_configs = true
