name: manual-public-online-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unsigned-public-only:
    runs-on: macos-14
    timeout-minutes: 30
    environment: manual-public-online
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements/macos-arm64-python312.lock
      - run: python -m pip install -r requirements/ci-macos-python312.lock
      - run: python -m pip install --no-deps -e .
      - name: Explicit unsigned public opt-in
        env:
          BINANCE_MARKET_RECORDER_ONLINE: "1"
        run: python -m pytest -q -m online
